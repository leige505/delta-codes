name: daily-update

# 北京时间 0点/16点/20点（UTC 16/8/12）各抓一次改枪码+每日密码并发布到 GitHub Pages
# 0点抓改枪码日更；16/20点补抓当天每日密码（攻略站白天才更新，只靠0点会整天显示昨天的密码）
# 注意：GitHub 定时任务可能延迟几分钟到几十分钟，属正常现象
on:
  schedule:
    - cron: '0 16 * * *'
    - cron: '0 8 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch codes and password
        env:
          TZ: Asia/Shanghai
        run: |
          mkdir -p _out publish
          python fetch_online.py _out
          cp _out/codes.json publish/codes.json
          cp version.json publish/version.json
          cp app.exe publish/app.exe

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
